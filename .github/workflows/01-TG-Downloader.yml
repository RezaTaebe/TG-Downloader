name: 01-📲 Telegram File Downloader Pro

on:
  workflow_dispatch:
    inputs:

      telegram_links:
        description: "🔗 Telegram links (comma, space, or newline separated)"
        required: true
        type: string

      password:
        description: "🔐 Archive password (optional)"
        required: false
        default: ""
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  download-telegram:

    name: 📥 Telegram Downloader Pro

    runs-on: ubuntu-24.04

    timeout-minutes: 360

    permissions:
      contents: write

    defaults:
      run:
        shell: bash

    steps:

      # ==========================================
      # Checkout
      # ==========================================

      - name: 📂 Checkout Repository
        uses: actions/checkout@v5

      # ==========================================
      # Install Dependencies
      # ==========================================

      - name: 🔧 Install Dependencies
        run: |

          sudo apt-get update -qq

          sudo apt-get install -y \
            curl \
            wget \
            jq \
            unzip \
            zip \
            p7zip-full \
            aria2 \
            python3 \
            python3-pip

          echo "✅ Dependencies Installed"

      # ==========================================
      # Prepare Workspace
      # ==========================================

      - name: 📁 Prepare Workspace
        run: |

          mkdir -p downloads
          mkdir -p output
          mkdir -p temp

          echo "✅ Workspace Ready"

      # ==========================================
      # Parse Telegram Links
      # ==========================================

      - name: 📋 Parse Telegram Links
        id: parse_links
        run: |

          python3 << 'PYEOF'

          import re
          import os
          import sys

          raw = """${{ github.event.inputs.telegram_links }}"""

          links = re.split(r'[\s,\n]+', raw)

          clean = []

          for item in links:

              item = item.strip()

              if item.startswith("http://") or item.startswith("https://"):
                  clean.append(item)

          clean = list(dict.fromkeys(clean))

          print("=" * 60)
          print(f"✅ Valid links found: {len(clean)}")
          print("=" * 60)

          if not clean:
              print("❌ No valid Telegram links detected")
              sys.exit(1)

          with open("links.txt", "w") as f:

              for link in clean:
                  f.write(link + "\n")

          print("✅ links.txt created successfully")

          PYEOF

      # ==========================================
      # Download Files
      # ==========================================

      - name: 📥 Download Telegram Files
        run: |

          COUNT=1

          while IFS= read -r URL
          do

            echo ""
            echo "=================================================="
            echo "📥 Downloading File #$COUNT"
            echo "$URL"
            echo "=================================================="

            aria2c \
              --dir=downloads \
              --file-allocation=none \
              --continue=true \
              --max-tries=10 \
              --retry-wait=5 \
              --summary-interval=10 \
              --download-result=full \
              --max-connection-per-server=16 \
              --split=16 \
              --min-split-size=1M \
              "$URL"

            COUNT=$((COUNT+1))

          done < links.txt

      # ==========================================
      # Show Downloaded Files
      # ==========================================

      - name: 📄 Show Downloaded Files
        run: |

          echo ""
          echo "================ DOWNLOADED FILES ================"

          ls -lah downloads || true

          echo "=================================================="

      # ==========================================
      # Create Archive
      # ==========================================

      - name: 📦 Create Archive
        run: |

          PASSWORD="${{ github.event.inputs.password }}"

          TIMESTAMP=$(date +%Y%m%d_%H%M%S)

          ARCHIVE="output/telegram_download_${TIMESTAMP}.7z"

          if [ -z "$PASSWORD" ]; then

            echo "📦 Creating archive without password..."

            7z a \
              "$ARCHIVE" \
              ./downloads/*

          else

            echo "🔐 Creating password-protected archive..."

            7z a \
              -p"$PASSWORD" \
              -mhe=on \
              "$ARCHIVE" \
              ./downloads/*

          fi

          echo ""
          echo "✅ Archive Created:"
          echo "$ARCHIVE"

      # ==========================================
      # Upload Artifact
      # ==========================================

      - name: 📤 Upload Archive
        uses: actions/upload-artifact@v6
        with:
          name: telegram-download
          path: output/*.7z
          retention-days: 7

      # ==========================================
      # Final Report
      # ==========================================

      - name: 📊 Final Report
        run: |

          echo ""
          echo "=================================================="
          echo "✅ TELEGRAM DOWNLOADER COMPLETED"
          echo "=================================================="

          echo ""
          echo "📁 Downloads Folder:"
          du -sh downloads || true

          echo ""
          echo "📦 Output Folder:"
          ls -lah output || true

          echo ""
          echo "💾 Remaining Disk Space:"
          df -h

          echo ""
          echo "🚀 Finished Successfully"
