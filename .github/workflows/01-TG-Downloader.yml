name: 📲 Telegram File Downloader

on:
  workflow_dispatch:
    inputs:
      telegram_links:
        description: '🔗 Telegram links (separate with commas, spaces, or new lines)'
        required: true
        type: string

      password:
        description: '🔐 Password for archive (optional)'
        required: false
        default: ''
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  download-telegram:
    name: 📥 Download Telegram Files
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    permissions:
      contents: write

    defaults:
      run:
        shell: bash

    steps:
      - name: 📂 Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: ⚙️ Configure Git
        run: |
          git config --global http.postBuffer 524288000
          git config --global core.compression 0
          git config --global pack.windowMemory 256m
          git config --global pack.packSizeLimit 100m
          git config --global pack.threads 1

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          echo "✅ Git configured"

      - name: 🔧 Install dependencies
        run: |
          sudo apt-get update -qq

          sudo apt-get install -y \
            curl \
            wget \
            jq \
            unzip \
            zip \
            p7zip-full \
            python3 \
            python3-pip \
            aria2

          echo "✅ Dependencies installed"

      - name: 📁 Create directories
        run: |
          mkdir -p downloads
          mkdir -p output

          echo "✅ Folders created"

      - name: 📋 Parse Telegram links
        id: parse
        run: |
          python3 << 'PYEOF'
          import re
          import os
          import sys

          raw = """${{ github.event.inputs.telegram_links }}"""

          links = re.split(r'[\s,\n]+', raw)
          links = [x.strip() for x in links if x.strip()]

          valid = []

          for link in links:
              if link.startswith("http://") or link.startswith("https://"):
                  valid.append(link)

          valid = list(dict.fromkeys(valid))

          print("=" * 60)
          print(f"✅ Total valid links: {len(valid)}")
          print("=" * 60)

          if not valid:
              print("❌ No valid Telegram links found")
              sys.exit(1)

          with open("links.txt", "w") as f:
              for item in valid:
                  f.write(item + "\n")

          print("✅ links.txt created")
          PYEOF

      - name: 📥 Download files
        run: |
          counter=1

          while IFS= read -r url
          do
            echo ""
            echo "======================================"
            echo "📥 Downloading:"
            echo "$url"
            echo "======================================"

            aria2c \
              --dir=downloads \
              --max-connection-per-server=16 \
              --split=16 \
              --min-split-size=1M \
              --continue=true \
              --retry-wait=5 \
              --max-tries=10 \
              "$url"

            counter=$((counter+1))

          done < links.txt

      - name: 📦 Create archive
        run: |
          PASSWORD="${{ github.event.inputs.password }}"

          TIMESTAMP=$(date +%Y%m%d_%H%M%S)

          if [ -z "$PASSWORD" ]; then

            7z a \
              "output/telegram_download_${TIMESTAMP}.7z" \
              ./downloads/*

          else

            7z a \
              -p"$PASSWORD" \
              -mhe=on \
              "output/telegram_download_${TIMESTAMP}.7z" \
              ./downloads/*

          fi

          echo "✅ Archive created"

      - name: 📤 Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: telegram-download
          path: output/*.7z
          retention-days: 7

      - name: 📊 Show results
        run: |
          echo ""
          echo "======================================"
          echo "✅ DOWNLOAD COMPLETED"
          echo "======================================"

          echo ""
          echo "📁 Downloaded files:"
          ls -lh downloads || true

          echo ""
          echo "📦 Archive:"
          ls -lh output || true

          echo ""
          echo "💾 Disk usage:"
          df -h

          echo ""
          echo "🎉 Finished successfully"
